services:
  - type: web
    name: quickcart-food-grocery
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: quickcart-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD_HASH
        sync: false
      - key: RESTAURANT_EMAIL
        sync: false
      - key: RESTAURANT_PASSWORD_HASH
        sync: false
      - key: GROCERY_EMAIL
        sync: false
      - key: GROCERY_PASSWORD_HASH
        sync: false
      - key: DELIVERY_EMAIL
        sync: false
      - key: DELIVERY_PASSWORD_HASH
        sync: false

databases:
  - name: quickcart-postgres
    plan: free
    databaseName: quickcart
    user: quickcart
